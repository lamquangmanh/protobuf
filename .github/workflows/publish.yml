name: publish-protobuf-packages

on:
  push:
    tags:
      - "v*"

jobs:
  publish-nodejs-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set Node package version from tag
        run: |
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version "$PACKAGE_VERSION"
          echo "Publishing @lamquangmanh/protobuf@$PACKAGE_VERSION"

      - name: Build Node package
        run: |
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          yarn build:ts

      - name: Publish Node package to GitHub Packages
        run: |
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@lamquangmanh/protobuf@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "@lamquangmanh/protobuf@$PACKAGE_VERSION already exists in GitHub Packages, skipping publish"
            exit 0
          fi
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-go-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate Go protobuf
        run: bash ./build_proto_go.sh

      - name: Verify Go module in gen/go
        run: |
          cd gen/go
          # Ensure go.mod has correct module path for pkg.go.dev discovery
          if ! grep -q "^module github.com/lamquangmanh/protobuf" go.mod; then
            echo "Updating module path in gen/go/go.mod"
            sed -i 's/^module .*/module github.com\/lamquangmanh\/protobuf\/gen\/go/' go.mod
          fi
          go mod tidy
          echo "Go module verified"
          cat go.mod | head -5

      - name: Upload generated Go artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gen/go/**
