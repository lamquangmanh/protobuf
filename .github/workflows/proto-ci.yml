name: proto-ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # creates a .npmrc file in the home directory of the runner.
      # - name: Create .npmrc securely
      #   run: |
      #     echo "@lamquangmanh:registry=https://npm.pkg.github.com" >> $HOME/.npmrc
      #     echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> $HOME/.npmrc
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.GIT_PAT }}

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Lint proto
        run: buf lint

      - name: Build Node protobuf
        run: yarn build:proto:node

      - name: Build Go protobuf
        run: yarn build:proto:go

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
